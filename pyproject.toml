[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ieee-fraud-pipeline"
version = "0.1.0"
description = "Reproducible IEEE-CIS fraud detection baseline"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2.0,<3",
    "scikit-learn>=1.4,<1.6",
    "joblib>=1.3,<2",
    "threadpoolctl>=3.1,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
fraud-detection = "fraud_detection.cli:main"

[tool.setuptools.packages.find]
include = ["fraud_detection*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
