global:
  scrape_interval: 5s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: fraud-api
    static_configs:
      - targets: ['api:8000']
  - job_name: fraud-worker
    static_configs:
      - targets: ['worker:9101']
  - job_name: fraud-history
    static_configs:
      - targets: ['sink:9102']
